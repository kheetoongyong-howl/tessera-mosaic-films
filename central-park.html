<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Park Seasons</title>
<style>
  :root{--bg:#050403;--ink:#ecd6aa;--bar:rgba(232,190,110,.55);color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;line-height:0}
  canvas{display:block;cursor:pointer}
  .nav{position:absolute;top:12px;right:12px;line-height:1.2;padding:7px 12px;border-radius:999px;
       font:12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;text-decoration:none;
       color:var(--ink);background:rgba(5,4,3,.55);border:1px solid rgba(232,190,110,.35);opacity:.8;transition:opacity .3s}
  .nav:hover,.nav:focus-visible{opacity:1;outline:none;border-color:rgba(232,190,110,.8)}
  #bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--bar)}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;
        font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.08em;
        color:var(--ink);opacity:.75;transition:opacity 1.2s;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--ink);
       font:14px system-ui,sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas><a class="nav" href="index.html">← Tessera</a><div id="bar"></div>
<div id="hint">click for sound &nbsp;·&nbsp; space pause &nbsp;·&nbsp; ← → seek &nbsp;·&nbsp; R restart</div></div></div>
<div id="err"></div>
<script>
"use strict";
// ============================================================================
//  TESSERA: FOUR SEASONS. A year in Central Park as a loose-tile mosaic.
//  Every tessera has two glass faces. A wave of flips turns the wall from one
//  season to the next; people and animals are flocks of tiles that lift off,
//  flip to show their other face, walk, swim and fly, then click back home.
//  WebGL2 + plain JavaScript, no libraries, no image, font or audio files.
// ============================================================================

const DURATION = 80;
const TAU = Math.PI*2;

// ---------------------------------------------------------------- utilities
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(19730405);
const drng = mulberry32(1858);              // design-only randomness
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const sstep5=t=>{t=clamp(t,0,1);return t*t*t*(t*(t*6-15)+10);};
const mix=(a,b,t)=>a+(b-a)*t;
const mixc=(a,b,t)=>[mix(a[0],b[0],t),mix(a[1],b[1],t),mix(a[2],b[2],t)];
const shade=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
function wrapP(a,p){ a=a%p; if(a>p*0.5)a-=p; else if(a<=-p*0.5)a+=p; return a; }
function bump(t,a,b,c,d){ return sstep(a,b,t)*(1-sstep(c,d,t)); }
function hh(a,b,c){ const v=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453; return v-Math.floor(v); }
const lin=c=>[Math.pow(clamp(c[0],0,1),2.2),Math.pow(clamp(c[1],0,1),2.2),Math.pow(clamp(c[2],0,1),2.2)];

// ---------------------------------------------------------------- the wall
const N=72, NT=N*N, P=2/N, SP=P;
const TS=P*0.86, TH=P*0.42;
// season transitions: start times of the flip waves (spring is season 0 and returns at the end)
const TRANS=[20,40,60,77.2];

// ---- the scene: Central Park looking south across the Lake to Bow Bridge and the towers
const SX=0.74, SYT=0.80, SYB=-0.53;
const DEEP=[[0.11,0.27,0.16],[0.08,0.15,0.38],[0.32,0.10,0.07],[0.10,0.13,0.26]];
const GOLD=[0.93,0.72,0.36];
const SKY=[[0.95,0.84,0.58],[0.93,0.71,0.33],[0.92,0.58,0.36],[0.80,0.83,0.89]];
const MEDS=[{x:-0.86,y:0.885,r:0.072,s:0},{x:0.86,y:0.885,r:0.072,s:1},{x:0.86,y:-0.745,r:0.1,s:2},{x:-0.86,y:-0.745,r:0.1,s:3}];
const BLD=[[-0.74,-0.63,0.40],[-0.63,-0.56,0.31],[-0.56,-0.45,0.49],[-0.45,-0.39,0.35],[-0.39,-0.30,0.58,'step'],
  [-0.30,-0.19,0.42],[-0.19,-0.13,0.68],[-0.13,0.02,0.37],[0.02,0.10,0.75,'tower'],[0.10,0.21,0.45],
  [0.21,0.28,0.60,'spire'],[0.28,0.40,0.39],[0.40,0.50,0.53,'step'],[0.50,0.61,0.33],[0.61,0.74,0.44]];
const BCOL=[[0.34,0.39,0.50],[0.38,0.43,0.52],[0.30,0.26,0.30],[0.17,0.21,0.32]];
const WIN=[[0.66,0.78,0.92],[0.70,0.82,0.94],[0.80,0.52,0.32],[0.28,0.34,0.50]];
const LIT=[0.08,0.05,0.18,0.5];
const CROWNS=[];
for (let k=0;k<11;k++) CROWNS.push({x:-0.70+k*0.14+(drng()-0.5)*0.04, y:0.12+drng()*0.06, r:0.095+drng()*0.035,
  cherry:(k===1||k===5||k===8), a:k%3, w:drng()*6});

function D(c,m,tag){ return {c,m:m||0,tag:tag||''}; }
const gridRC=(x,y)=>[Math.floor((x+1)/P),Math.floor((y+1)/P)];

function medallion(dx,dy,d,M,s){
  const R=M.r*0.78, q=d/R, a=Math.atan2(dy,dx), on=M.s===s;
  if (d>R) return D(on?GOLD:[0.40,0.33,0.22],on?1:0,'medal');
  const ground=shade(DEEP[M.s],0.85);
  if (M.s===0){ if (q<0.28) return D([0.98,0.82,0.25],0,'medal');
    if (q<0.32+0.62*Math.abs(Math.cos(2.5*a))) return D(q>0.7?[0.99,0.9,0.94]:[0.96,0.62,0.74],0,'medal'); }
  if (M.s===1){ if (q<0.45) return D([0.97,0.55,0.12],0,'medal'); if (Math.cos(8*a)>0.15&&q<0.95) return D([0.99,0.85,0.25],0,'medal'); }
  if (M.s===2){ const aa=a-Math.PI/2;
    if (Math.abs(dx)<P*0.5&&dy<0&&q<0.95) return D([0.42,0.25,0.12],0,'medal');
    if (q<0.36+0.56*Math.abs(Math.cos(2.5*aa))&&dy>-R*0.35) return D(q<0.35?[0.95,0.5,0.12]:[0.82,0.16,0.08],0,'medal'); }
  if (M.s===3){ if (q<0.22||(d*Math.abs(Math.sin(3*a))<P*0.55&&q<0.92)) return D([0.96,0.97,1.0],0,'medal'); }
  return D(ground,0,'medal');
}
function frameBand(x,y,s,ci,ri){
  const m=Math.max(Math.abs(x),Math.abs(y));
  for (const M of MEDS){ const d=Math.hypot(x-M.x,y-M.y); if (d<M.r) return medallion(x-M.x,y-M.y,d,M,s); }
  if (m>1-P*1.05) return D(shade(DEEP[s],0.45),0,'frame');
  if (m>1-P*2.05) return D(GOLD,1,'frame');
  const dist=Math.max(Math.abs(x)-SX,y-SYT,SYB-y);
  if (dist<P*0.95) return D(GOLD,1,'frame');
  return D(shade(DEEP[s],hh(ci,ri,7)<0.5?0.9:1.08),0,'frame');
}
function sky(x,y,s,ci,ri){
  const k=0.96+0.08*hh(ci,ri,2);
  if (s===0){
    const d=Math.hypot(x,y-0.04);
    if (d>0.60&&d<0.712){ const RB=[[0.36,0.30,0.70],[0.25,0.62,0.35],[0.98,0.86,0.30],[0.96,0.56,0.14]];
      return D(RB[Math.min(3,Math.floor((d-0.60)/0.028))],0,'sky'); }
    for (const [cx,cy,sc] of [[-0.5,0.70,0.7],[0.55,0.74,0.55]]){
      const c=cloud(x,y,cx,cy,sc); if (c) return D(c===2?[0.62,0.70,0.84]:[0.97,0.97,0.95],0,'sky'); }
  }
  if (s===1){
    const d=Math.hypot(x-0.52,y-0.66);
    if (d<0.05) return D([0.99,0.86,0.30],0,'sky'); if (d<0.075) return D([0.96,0.50,0.12],0,'sky');
    const c=cloud(x,y,-0.52,0.72,0.55); if (c) return D(c===2?[0.70,0.76,0.86]:[0.98,0.97,0.94],0,'sky');
  }
  if (s===2){ const d=Math.hypot(x+0.5,y-0.42); if (d<0.06) return D([0.98,0.62,0.18],0,'sky'); if (d<0.09) return D([0.86,0.24,0.10],0,'sky'); }
  if (s===3){ const d=Math.hypot(x-0.5,y-0.68);
    if (d<0.055) return D(hh(ci,ri,9)<0.25?[0.78,0.82,0.88]:[0.97,0.97,0.99],0,'sky'); }
  const g=sstep(0.1,0.8,y);
  return D(shade(mixc(mixc(SKY[s],[1,1,1],0.12),SKY[s],g),k),1,'sky');
}
function cloud(x,y,cx,cy,s){
  let inside=false;
  for (const q of [[0,0,0.09],[0.085,0.02,0.07],[-0.08,-0.01,0.065],[0.03,0.06,0.06]]){
    const dx=x-(cx+q[0]*s), dy=y-(cy+q[1]*s); if (dx*dx+dy*dy<(q[2]*s)**2) inside=true; }
  return inside ? (y<cy-0.03*s?2:1) : 0;
}
function skyline(x,y,s,ci,ri){
  if (y<0.10) return null;
  for (let b=0;b<BLD.length;b++){ const B=BLD[b]; if (x<B[0]||x>=B[1]) continue;
    let top=B[2]; const u=(x-B[0])/(B[1]-B[0]);
    if (B[3]==='step'&&(u<0.22||u>0.78)) top-=0.08;
    if (B[3]==='tower'&&u>0.62) top-=0.11;
    if (B[3]==='spire'){ const c=Math.abs(u-0.5)*2; top-=c*0.12; if (c<0.2) top+=0.07; }
    if (y>top) return null;
    const sh=b%2?0.8:1.12;
    if (ci%2===0&&ri%2===1&&y<top-P*0.8&&(B[3]!=='spire'||y<top-0.12)){
      if (hh(ci,ri,11)<LIT[s]) return D([0.99,0.80,0.42],1,'bld');
      return D(shade(WIN[s],sh),0,'bld'); }
    return D(shade(BCOL[s],sh),0,'bld');
  }
  return null;
}
function trees(x,y,s,ci,ri,lakeTop){
  for (const C of CROWNS){
    const dx=x-C.x, dy=y-C.y, d=Math.hypot(dx,dy*1.15), a=Math.atan2(dy,dx);
    if (s!==3 && d<C.r*(0.93+0.09*Math.sin(a*5+C.w))){
      const hi=(dx*-0.6+dy*0.8)>C.r*0.35, sp=hh(ci,ri,13);
      let c;
      if (s===0) c=C.cherry ? (sp<0.3?[0.99,0.93,0.95]:[0.96,0.68,0.78]) : (sp<0.25?[0.72,0.86,0.42]:[0.52,0.74,0.32]);
      else if (s===1) c=sp<0.3?[0.14,0.36,0.16]:[0.22,0.48,0.20];
      else { const A=[[0.94,0.50,0.12],[0.78,0.16,0.08],[0.96,0.78,0.22]];
        c = sp<0.18 ? A[(C.a+1)%3] : (sp<0.25?[0.50,0.30,0.14]:A[C.a]); }
      if (hi) c=mixc(c,[1,0.97,0.8],0.18);
      return D(c,0,'canopy');
    }
    if (s===3 && d<C.r){
      const bx=dx, by=y-(C.y-C.r*0.75), ang=Math.atan2(by,bx), rad=Math.hypot(bx,by);
      if (by>0 && Math.abs(Math.sin(ang*3.5+rad*9+C.w))*rad<P*0.55)
        return D(hh(ci,ri,17)<0.4?[0.96,0.97,1.0]:[0.30,0.22,0.16],0,'canopy');
    }
    if (Math.abs(dx)<P*0.7 && y>lakeTop && y<C.y-C.r*0.45) return D([0.32,0.22,0.15],0,'trunk');
  }
  return null;
}
function bridge(x,y,s,ci,ri){
  // Bow Bridge: a shallow cream cast-iron arch with an open balustrade
  const W=0.42, ax=Math.abs(x), cream=[0.99,0.91,0.70], snow=[0.96,0.97,1.0];
  const yd=v=>-0.12+0.11*(1-(v/W)**2);
  if (ax>=W&&ax<W+0.05){ if (y<yd(W)+P*0.6&&y>-0.33) return D(hh(ci,ri,4)<0.3?[0.58,0.54,0.50]:[0.46,0.43,0.40],0,'bridge'); return null; }
  if (ax>=W) return null;
  const top=yd(x), ya=-0.27+0.16*(1-(x/W)**2);
  if (y>top&&y<=top+P*1.7){ if (y>top+P*0.95) return D(s===3?snow:cream,0,'bridge'); return ci%2===0?D(cream,0,'bridge'):null; }
  if (y<=top&&y>top-P) return D(cream,0,'bridge');
  if (y<=top-P&&y>ya) return null;
  if (y<=ya&&y>ya-P) return D(cream,0,'bridge');
  return null;
}
function water(x,y,s,ci,ri,lakeTop){
  if (s===3){
    if (Math.abs(Math.sin(x*23+Math.sin(y*31)*2)+Math.sin(y*17-x*7))<0.09) return D([0.56,0.65,0.76],0,'lake');
    return D(hh(ci,ri,3)<0.5?[0.87,0.92,0.97]:[0.75,0.84,0.93],0,'lake');
  }
  const base=[[0.22,0.48,0.64],[0.13,0.42,0.60],[0.10,0.20,0.40]][s];
  const depth=lakeTop-y;
  if (depth<0.15){ const t=trees(x,2*lakeTop-y,s,ci,ri,-9);
    if (t && hh(ci,ri,5)<0.85-depth*4) return D(shade(mixc(t.c,base,0.45),0.72),0,'lake'); }
  const fr=y*14+0.4*Math.sin(x*9); if (fr-Math.floor(fr)<0.07) return D(mixc(base,[0.55,0.85,0.98],0.4),0,'lake');
  return D(shade(base,0.92+0.16*hh(ci,ri,6)),0,'lake');
}
function lawn(x,y,s,ci,ri){
  const pc=-0.44+0.05*Math.sin(x*3.2+0.5), r=hh(ci,ri,21);
  if (Math.abs(y-pc)<P*0.8) return D(s===3?[0.64,0.58,0.52]:[0.78,0.73,0.62],0,'lawn');
  if (s===0){ if (r<0.06) return D([0.98,0.84,0.22],0,'lawn'); if (r<0.11) return D(r<0.085?[0.90,0.18,0.20]:[0.96,0.56,0.70],0,'lawn');
    return D(r<0.5?[0.38,0.66,0.27]:[0.46,0.72,0.31],0,'lawn'); }
  if (s===1){
    for (const [bx,by,c] of [[-0.36,-0.48,[0.85,0.15,0.12]],[0.4,-0.385,[0.2,0.35,0.75]]])
      if (Math.abs(x-bx)<0.065&&Math.abs(y-by)<0.035) return D((ci+ri)%2?c:[0.96,0.95,0.92],0,'lawn');
    return D(Math.floor((x+2)/0.1)%2?[0.23,0.50,0.19]:[0.28,0.56,0.22],0,'lawn'); }
  if (s===2){ const L=[[0.94,0.50,0.12],[0.80,0.18,0.08],[0.95,0.78,0.22],[0.50,0.30,0.14]];
    if (r<0.3) return D(L[Math.floor(r/0.075)],0,'lawn'); return D(r<0.65?[0.43,0.48,0.21]:[0.50,0.53,0.25],0,'lawn'); }
  return D(r<0.6?[0.94,0.95,0.98]:[0.80,0.86,0.94],0,'lawn');
}
function scene(x,y,s,ci,ri){
  const lakeTop=-0.02+0.012*Math.sin(x*9), lakeBot=-0.34+0.02*Math.sin(x*6+1);
  if (Math.abs(x+0.64)<P*0.55&&y<-0.12) return D([0.12,0.22,0.16],0,'lamp');
  if (Math.abs(x+0.64)<P*1.2&&y>=-0.12&&y<-0.05) return D(s>=2?[0.99,0.82,0.45]:[0.92,0.93,0.90],s>=2?1:0,'lamp');
  if (y<lakeBot) return lawn(x,y,s,ci,ri);
  const br=bridge(x,y,s,ci,ri); if (br) return br;
  if (y<lakeTop) return water(x,y,s,ci,ri,lakeTop);
  if (y<lakeTop+0.025+0.012*Math.sin(x*13)){
    if (s===3&&y>lakeTop+0.01) return D([0.95,0.96,0.99],0,'rock');
    return D(hh(ci,ri,8)<0.5?[0.33,0.32,0.33]:[0.44,0.43,0.44],0,'rock'); }
  const tr=trees(x,y,s,ci,ri,lakeTop); if (tr) return tr;
  if (y<0.085+0.02*Math.sin(x*17)){ // shrubs along the far shore
    const r=hh(ci,ri,19), SH=[[[0.22,0.44,0.20],[0.30,0.52,0.24]],[[0.10,0.28,0.11],[0.16,0.36,0.15]],
      [[0.46,0.30,0.12],[0.60,0.36,0.12]],[[0.86,0.89,0.94],[0.32,0.28,0.25]]][s];
    return D(r<(s===3?0.65:0.5)?SH[0]:SH[1],0,'shrub'); }
  const bd=skyline(x,y,s,ci,ri); if (bd) return bd;
  return sky(x,y,s,ci,ri);
}
function design(x,y,s){
  const [ci,ri]=gridRC(x,y);
  if (Math.abs(x)<SX&&y<SYT&&y>SYB) return scene(x,y,s,ci,ri);
  return frameBand(x,y,s,ci,ri);
}

// ---- tiles
const hx=new Float32Array(NT),hy=new Float32Array(NT),hz=new Float32Array(NT);
const hrx=new Float32Array(NT),hry=new Float32Array(NT),hrz=new Float32Array(NT);
const px=new Float32Array(NT),py=new Float32Array(NT),pz=new Float32Array(NT);
const vx=new Float32Array(NT),vy=new Float32Array(NT),vz=new Float32Array(NT);
const arx=new Float32Array(NT),ary=new Float32Array(NT),arz=new Float32Array(NT);
const wx=new Float32Array(NT),wy=new Float32Array(NT),wz=new Float32Array(NT);
const tau=new Float32Array(NT),tumPsi=new Float32Array(NT),spin=new Float32Array(NT),swirlS=new Float32Array(NT);
const flash=new Float32Array(NT), ret=new Uint8Array(NT);
const ownPrev=new Int16Array(NT), ownNow=new Int16Array(NT), slotOf=new Int32Array(NT);
const protect=new Uint8Array(NT), canopyA=new Uint8Array(NT), lakeT=new Uint8Array(NT);
// two faces per tile, each rgb + metal flag; which face is "home", and the flip angle that shows it
const faces=new Float32Array(NT*8), hFace=new Uint8Array(NT), ryBase=new Float32Array(NT);
const seasonOf=new Uint8Array(NT), lastFlip=new Float32Array(NT), flipT=new Float32Array(NT*4);
const SC=[0,1,2,3].map(()=>new Float32Array(NT*4));
const designTex=[0,1,2,3].map(()=>new Uint8Array(NT*4));
const stat=new Float32Array(NT*4);
let facesDirty=true;

for (let j=0;j<N;j++) for (let i=0;i<N;i++){
  const k=j*N+i;
  const x=-1+(i+0.5)*P+((j&1)?0.22:-0.22)*P+(rnd()-0.5)*0.12*P;
  const y=-1+(j+0.5)*P+(rnd()-0.5)*0.12*P;
  hx[k]=x; hy[k]=y; hz[k]=TH*0.5+rnd()*0.0015;
  hrx[k]=(rnd()-0.5)*0.1; hry[k]=(rnd()-0.5)*0.1; hrz[k]=(rnd()-0.5)*0.16;
  for (let s=0;s<4;s++){
    const d=design(x,y,s), b=0.9+0.2*hh(k,s,1), hue=(hh(k,s,2)-0.5)*0.05;
    const L=lin([d.c[0]*b+hue,d.c[1]*b,d.c[2]*b-hue]);
    SC[s][k*4]=L[0]; SC[s][k*4+1]=L[1]; SC[s][k*4+2]=L[2]; SC[s][k*4+3]=d.m;
    designTex[s][k*4]=d.c[0]*255; designTex[s][k*4+1]=d.c[1]*255; designTex[s][k*4+2]=d.c[2]*255; designTex[s][k*4+3]=255;
    if (d.tag==='medal'||d.tag==='bridge'||d.tag==='lamp') protect[k]=1;
    if (s===2&&d.tag==='canopy') canopyA[k]=1;
    if (s===0&&d.tag==='lake') lakeT[k]=1;
  }
  stat[k*4]=TS*(0.93+0.1*rnd()); stat[k*4+1]=TH*(0.9+0.2*rnd()); stat[k*4+2]=rnd();
  tumPsi[k]=rnd()*TAU; spin[k]=(rnd()<0.5?-1:1)*(7+9*rnd()); swirlS[k]=(rnd()<0.5?-1:1)*(0.6+rnd());
  const r=Math.hypot(x,y);
  flipT[k]      =TRANS[0]+(x+1)/2*2.6+rnd()*0.35;            // summer arrives from the east

function spriteSlots(def){
  const rows=def.rows, h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const cc=(w-1)/2, rc=(h-1)/2, out=[];
  for (let r=0;r<h;r++){
    const row=rows[r]; let minC=99,maxC=-1,legIdx=0;
    for (let c=0;c<row.length;c++) if (row[c]!=='.'){ minC=Math.min(minC,c); maxC=Math.max(maxC,c); }
    for (let c=0;c<row.length;c++){
      const ch=row[c]; if (ch==='.') continue;
      const col=(def.pal&&def.pal[ch])||COLK[ch];
      let part=0;
      if (def.sway&&def.sway.includes(ch)) part=7;
      else if (def.kind==='person'){
        if (r>=def.legsFrom) part=c<cc?1:2;
        else if (def.arms&&r>=def.arms[0]&&r<=def.arms[1]){ if (c===minC) part=3; else if (c===maxC) part=4; }
      } else if (def.kind==='side'){ if (def.legsFrom!=null&&r>=def.legsFrom) part=1+(legIdx++%2); }
      else if (def.kind==='top'){ if (Math.abs(c-cc)>def.body) part=c<cc?5:6; }
      out.push({lx:(c-cc)*SP, ly:(rc-r)*SP, r, part, col:lin(col)});
    }
  }
  if (def.oars) for (const [oc,orow] of def.oars) for (let d=1;d<=6;d++)
    out.push({lx:0,ly:0,r:0,part:8,px:(oc-cc)*SP,py:(rc-orow)*SP,d,col:lin([.82,.68,.44])});
  out.h=h; out.w=w;
  return out;
}

// ---------------------------------------------------------------- recruiting
const busyUntil=new Float32Array(NT).fill(-10);
function recruit(slots,ox,oy,tStart,tFree){
  const cand=[];
  for (let i=0;i<NT;i++) if (!protect[i]&&busyUntil[i]<tStart-0.3) cand.push(i);
  cand.sort((a,b)=>((hx[a]-ox)**2+(hy[a]-oy)**2)-((hx[b]-ox)**2+(hy[b]-oy)**2));
  const pool=cand.slice(0,slots.length*5);
  for (let q=pool.length-1;q>0;q--){ const r=Math.floor(rnd()*(q+1)); [pool[q],pool[r]]=[pool[r],pool[q]]; }
  const take=pool.slice(0,slots.length);
  // coherent mapping: sort both by angle about their centroids
  const ang=(xs,ys)=>{let mx=0,my=0;for(let q=0;q<xs.length;q++){mx+=xs[q];my+=ys[q];}mx/=xs.length;my/=xs.length;
    return xs.map((_,q)=>Math.atan2(ys[q]-my,xs[q]-mx));};
  const sx=slots.map(s=>s.part===8?s.px:s.lx), sy=slots.map(s=>s.part===8?s.py:s.ly);
  const sa=ang(sx,sy), ta=ang(take.map(i=>hx[i]),take.map(i=>hy[i]));
  const si=slots.map((_,q)=>q).sort((a,b)=>sa[a]-sa[b]), ti=take.map((_,q)=>q).sort((a,b)=>ta[a]-ta[b]);
  const tiles=new Int32Array(slots.length);
  for (let q=0;q<si.length;q++){ tiles[si[q]]=take[ti[q]]; busyUntil[take[ti[q]]]=tFree; }
  return tiles;
}

function makeBody(path){
  const b={cx:0,cy:0,th:0,init:false};
  b.reset=()=>{b.init=false;};
  b.update=(t,dt)=>{
    path(t,TMP); b.cx=TMP[0]; b.cy=TMP[1];
    path(t+0.05,TMP2); let dx=TMP2[0]-TMP[0], dy=TMP2[1]-TMP[1];
    if (dx*dx+dy*dy<1e-10){ for(let s=0.1;s<6&&dx*dx+dy*dy<1e-10;s+=0.1){path(t+s,TMP2);dx=TMP2[0]-TMP[0];dy=TMP2[1]-TMP[1];} }
    let th=Math.atan2(dy,dx);
    if (!b.init){ b.th=th; b.init=true; }
    b.th += wrapP(th-b.th,TAU)*Math.min(1,dt*6);
  };
  return b;
}
function placeSprite(s,Q,o){
  let lx=s.lx, ly=s.ly, z=Q.z, rx=0, ry=0;
  const ph=Q.ph, g=Q.gait;
  if (g==='walk'||g==='run'){
    const run=g==='run', A=run?1.3:0.8, Ar=run?0.9:0.5;
    ly+=(run?0.4:0.2)*SP*Math.abs(Math.cos(ph));
    if (s.part===1){ const u=Math.max(0,Math.sin(ph)); ly+=A*SP*u; z+=0.02*u; rx=-0.5*u; }
    else if (s.part===2){ const u=Math.max(0,-Math.sin(ph)); ly+=A*SP*u; z+=0.02*u; rx=-0.5*u; }
    else if (s.part===3) ly+=Ar*SP*Math.max(0,-Math.sin(ph));
    else if (s.part===4) ly+=Ar*SP*Math.max(0,Math.sin(ph));
  } else if (g==='skate'){
    lx+=0.5*SP*Math.sin(ph);
    if (s.part===1){ const u=Math.max(0,Math.sin(ph)); lx-=1.5*SP*u; ly+=0.4*SP*u; }
    if (s.part===2){ const u=Math.max(0,-Math.sin(ph)); lx+=1.5*SP*u; ly+=0.4*SP*u; }
    if (s.part===3){ lx-=0.9*SP; ly+=0.4*SP; } if (s.part===4){ lx+=0.9*SP; ly+=0.4*SP; }
  } else if (g==='hop'){ ly+=2.2*SP*Math.pow(Math.max(0,Math.sin(ph)),0.6); }
  else if (g==='quad'){ ly+=0.15*SP*Math.abs(Math.cos(ph));
    if (s.part===1) ly+=0.6*SP*Math.max(0,Math.sin(ph)); if (s.part===2) ly+=0.6*SP*Math.max(0,-Math.sin(ph)); }
  else if (g==='swim'){ ly+=0.3*SP*Math.sin(ph); }
  else if (g==='row'){ ly+=0.15*SP*Math.sin(ph);
    if (s.part===8){ const a=-Math.PI/2-0.5+0.6*Math.sin(ph); lx=s.px+Math.cos(a)*s.d*SP; ly=s.py+Math.sin(a)*s.d*SP; } }
  if (s.part===7) lx+=1.1*SP*Math.sin(Q.t*1.3)*Math.max(0,8-s.r)/8;
  if (g==='fly'&&(s.part===5||s.part===6)){
    const sg=s.part===6?1:-1, e=Math.abs(lx)-Q.bodyHalf, phi=Q.flapA*Math.sin(ph-e*Q.lag);
    lx=sg*(Q.bodyHalf+e*Math.cos(phi)); z+=e*Math.sin(phi); ry=sg*phi;
  }
  if (Q.top){
    const a=Q.th-Math.PI/2, c=Math.cos(a), sn=Math.sin(a);
    o.x=Q.cx+c*lx-sn*ly; o.y=Q.cy+sn*lx+c*ly; o.z=z; o.rz=a; o.rx=0; o.ry=ry;
  } else {
    o.x=Q.cx+lx*Q.face; o.y=Q.cy+ly; o.z=z; o.rz=g==='swim'?0.05*Math.sin(ph):0; o.rx=rx; o.ry=0;
  }
}

        if (opt.timePhase) Q.ph+=dt*opt.timePhase; else Q.ph+=Math.abs(dx)/(opt.stride||0.1)*TAU;

}

function attr(loc,size,stride,off,div){ gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,off); gl.vertexAttribDivisor(loc,div); }
function instAttribs(){
  gl.bindBuffer(gl.ARRAY_BUFFER,dynBuf); attr(3,3,32,0,1); attr(4,4,32,12,1); attr(5,1,32,28,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,faceBuf); attr(6,4,32,0,1); attr(8,4,32,16,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,statBuf); attr(7,4,16,0,1);
}
const vaoTile=gl.createVertexArray(); gl.bindVertexArray(vaoTile);
gl.bindBuffer(gl.ARRAY_BUFFER,boxBuf); attr(0,3,28,0,0); attr(1,3,28,12,0); attr(2,1,28,24,0); instAttribs();
const vaoSh=gl.createVertexArray(); gl.bindVertexArray(vaoSh);
gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf); attr(0,2,8,0,0); instAttribs();
const vaoWall=gl.createVertexArray(); gl.bindVertexArray(vaoWall);
gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf); attr(0,2,8,0,0);
const vaoEmpty=gl.createVertexArray();
gl.bindVertexArray(null);

function mkTex(w,h,data){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }
const SHN=1024, shTex=mkTex(SHN,SHN,null);
const shFB=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,shFB);
gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,shTex,0);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);
const dTex=mkTex(N,N,designTex[0]); let dTexSeason=0;

// ---------------------------------------------------------------- camera, light, seasons
function perspective(fov,asp,n,f){ const t=1/Math.tan(fov/2); return [t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]; }
function lookAt(e,c,u){
  let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]]; let l=Math.hypot(...z); z=z.map(v=>v/l);
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]]; l=Math.hypot(...x); x=x.map(v=>v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1];
}
function mul4(a,b){ const o=new Array(16); for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;} return o; }
// continuous season value 0..4
const seasonV=t=>TRANS.reduce((a,T)=>a+sstep(T,T+2.8,t),0);
function lerpSeason(tab,sv){ const i=Math.min(3,Math.floor(sv)), f=sv-i; return mixc(tab[i],tab[i+1],f); }
const LCOL=[[1,.94,.84],[1,.88,.66],[1,.76,.54],[.8,.88,1],[1,.94,.84]];
const ENVT=[[1,.95,.85],[1.1,.95,.75],[1.05,.8,.6],[.75,.85,1.1],[1,.95,.85]];
const LDIR=[[-.42,.55,.9],[-.15,.75,.85],[-.75,.35,.8],[-.55,.3,.95],[-.42,.55,.9]];
function cameraAt(t){
  const intro=1-sstep5(t/9);
  let yaw=0.03*Math.sin(t*0.13), pitch=0.02*Math.sin(t*0.17+1), dist=4.28+0.6*intro;
  TRANS.forEach((T,k)=>{ const b=bump(t,T-0.5,T+1.3,T+2.8,T+4.6); yaw+=0.11*(k%2?-1:1)*b; pitch+=0.05*b; dist+=0.12*b; });
  return {eye:[dist*Math.sin(yaw)*Math.cos(pitch),-dist*Math.sin(pitch)*0.6,dist*Math.cos(yaw)*Math.cos(pitch)],tgt:[0,0,0]};
}
function lightAt(t){ const sweep=sstep(0,7,t); return [mix(-2.2,0,sweep)+1.6*Math.sin(t*0.19)*sweep,0.55+0.6*Math.sin(t*0.11+0.5),1.6]; }

// ---------------------------------------------------------------- audio (synthesised)
let AC=null, master=null, noiseBuf=null, drone=null, soundOn=false, oscs=[], chordIdx=-1;
const CHORDS=[[110,138.6,164.8,220],[146.8,185,220,293.7],[110,130.8,164.8,220],[82.4,98,123.5,164.8]];
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.9;
  const dl=AC.createDelay(0.5); dl.delayTime.value=0.083; const fb=AC.createGain(); fb.gain.value=0.28;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
  master.connect(AC.destination); master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.06,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  drone=AC.createGain(); drone.gain.value=0;
  const dlp=AC.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=700;
  [0.5,0.32,0.22,0.12].forEach((a,k)=>{ const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=CHORDS[0][k];
    const g=AC.createGain(); g.gain.value=a; o.connect(g); g.connect(dlp); o.start(); oscs.push(o); });
  dlp.connect(drone); drone.connect(master);
}
function click(vol){
  const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=0.6+Math.random()*0.9;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800+Math.random()*3800; f.Q.value=4;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0005,t+0.05);
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
  if (Math.random()<0.35){ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=2400+Math.random()*2600;
    const og=AC.createGain(); og.gain.setValueAtTime(vol*0.18,t); og.gain.exponentialRampToValueAtTime(0.0003,t+0.09);
    o.connect(og); og.connect(master); o.start(t); o.stop(t+0.1); }
}

// ---------------------------------------------------------------- frame
let W_=0,H_=0;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2), s=Math.floor(Math.min(window.innerWidth,window.innerHeight));
  canvas.style.width=s+'px'; canvas.style.height=s+'px'; W_=H_=Math.floor(s*dpr); canvas.width=W_; canvas.height=H_;
}
window.addEventListener('resize',resize); resize();

function buildInstances(){
  for (let i=0;i<NT;i++){
    const o=i*8;
    dyn[o]=px[i]; dyn[o+1]=py[i]; dyn[o+2]=pz[i];
    const hz_=arz[i]*0.5, hx_=arx[i]*0.5, hy_=ary[i]*0.5, ht=tau[i]*0.5;
    const cz=Math.cos(hz_),sz=Math.sin(hz_),cx=Math.cos(hx_),sx=Math.sin(hx_),cy=Math.cos(hy_),sy=Math.sin(hy_);
    const aw=cz*cx, ax=cz*sx, ay=sz*sx, az=sz*cx;
    const bw=aw*cy-ay*sy, bx=ax*cy-az*sy, by=aw*sy+ay*cy, bz=az*cy+ax*sy;
    const ct=Math.cos(ht), st=Math.sin(ht), tx=Math.cos(tumPsi[i])*st, ty=Math.sin(tumPsi[i])*st;
    dyn[o+6]=bw*ct-bx*tx-by*ty; dyn[o+3]=bw*tx+bx*ct-bz*ty; dyn[o+4]=bw*ty+by*ct+bz*tx; dyn[o+5]=bz*ct+bx*ty-by*tx;
    dyn[o+7]=flash[i];
  }
}

let playT=0, playing=true, last=performance.now(), hintShown=performance.now();
const bar=document.getElementById('bar'), hint=document.getElementById('hint');

function render(t){
  const {eye,tgt}=cameraAt(t);
  const VP=mul4(perspective(30*Math.PI/180,1,0.1,30),lookAt(eye,tgt,[0,1,0]));
  const sv=seasonV(t), LP=lightAt(t);
  const Lcol=lerpSeason(LCOL,sv), Env=lerpSeason(ENVT,sv);
  let Ld=lerpSeason(LDIR,sv); const ll=Math.hypot(...Ld); Ld=Ld.map(v=>v/ll);
  const fade=sstep(0,2.4,t)*(1-sstep(78.4,79.9,t));
  buildInstances();
  gl.bindBuffer(gl.ARRAY_BUFFER,dynBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,dyn);
  if (facesDirty){ gl.bindBuffer(gl.ARRAY_BUFFER,faceBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,faces); facesDirty=false; }
  const si=Math.round(sv)%4;
  if (si!==dTexSeason){ gl.bindTexture(gl.TEXTURE_2D,dTex); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,N,N,gl.RGBA,gl.UNSIGNED_BYTE,designTex[si]); dTexSeason=si; }

  gl.bindFramebuffer(gl.FRAMEBUFFER,shFB); gl.viewport(0,0,SHN,SHN);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(progSh.p); gl.uniform3fv(progSh.u.uLdir,Ld);
  gl.bindVertexArray(vaoSh); gl.drawArraysInstanced(gl.TRIANGLES,0,6,NT);
  gl.disable(gl.BLEND);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W_,H_);
  gl.clearColor(0.012,0.009,0.007,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  const setCommon=pr=>{ const u=pr.u; gl.useProgram(pr.p);
    gl.uniformMatrix4fv(u.uVP,false,VP); if(u.uRes) gl.uniform2f(u.uRes,W_,H_);
    if(u.uFade) gl.uniform1f(u.uFade,fade); if(u.uTime) gl.uniform1f(u.uTime,t);
    if(u.uCam) gl.uniform3fv(u.uCam,eye); if(u.uLdir) gl.uniform3fv(u.uLdir,Ld);
    if(u.uLP) gl.uniform3fv(u.uLP,LP); if(u.uLcol) gl.uniform3fv(u.uLcol,Lcol); if(u.uEnv) gl.uniform3fv(u.uEnv,Env); };
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,shTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,dTex);
  setCommon(progWall); gl.uniform1i(progWall.u.uShadow,0); gl.uniform1i(progWall.u.uDesign,1);
  gl.bindVertexArray(vaoWall); gl.drawArrays(gl.TRIANGLES,0,6);
  setCommon(progTile); gl.uniform1i(progTile.u.uShadow,0);
  gl.bindVertexArray(vaoTile); gl.drawArraysInstanced(gl.TRIANGLES,0,36,NT);
  // weather
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  setCommon(progMote); gl.uniform1f(progMote.u.uPx,H_/220);
  const ws=[Math.max(1-sstep(TRANS[0],TRANS[0]+3,t),sstep(TRANS[3],TRANS[3]+2,t))*0.8,
    bump(t,TRANS[0]+1,TRANS[0]+6,TRANS[1],TRANS[1]+2), bump(t,TRANS[1]+1,TRANS[1]+3,TRANS[2],TRANS[2]+2),
    bump(t,TRANS[2]+0.5,TRANS[2]+3,TRANS[3],TRANS[3]+1.5)];
  const counts=[260,140,180,900];
  gl.bindVertexArray(vaoEmpty);
  for (let k=0;k<4;k++) if (ws[k]>0.01){ gl.uniform1f(progMote.u.uType,k); gl.uniform1f(progMote.u.uW,ws[k]); gl.drawArrays(gl.POINTS,0,counts[k]); }
  gl.depthMask(true); gl.disable(gl.BLEND); gl.bindVertexArray(null);
}

function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (playing){ playT+=dt; if (playT>=DURATION){ playT=0; resetSim(); } }
  if (playT<simT) resetSim();
  simTo(playT,1200);
  if (soundOn&&AC){
    const n=Math.min(clicksPending,5);
    for (let q=0;q<n;q++) click(0.22*Math.min(1,0.4+clicksPending/12)*(0.6+Math.random()*0.4));
    let air=0; for (let i=0;i<NT;i+=7) if (pz[i]>hz[i]+0.03) air++;
    drone.gain.setTargetAtTime((0.02+0.08*air/(NT/7))*sstep(0,3,playT)*(1-sstep(77.5,80,playT)),AC.currentTime,0.4);
    const ci=Math.round(seasonV(playT))%4;
    if (ci!==chordIdx){ chordIdx=ci; oscs.forEach((o,k)=>o.frequency.setTargetAtTime(CHORDS[ci][k],AC.currentTime,0.8)); }
  }
  clicksPending=0;
  render(playT);
  bar.style.width=(playT/DURATION*100)+'%';
  if (now-hintShown>4500) hint.style.opacity=0;
  requestAnimationFrame(frame);
}

canvas.addEventListener('click',()=>{
  if (!AC){ try{ initAudio(); }catch(e){} }
  if (AC){ soundOn=!soundOn; if (soundOn) AC.resume(); else drone.gain.setTargetAtTime(0,AC.currentTime,0.1); }
});
window.addEventListener('keydown',e=>{
  if (e.code==='Space'){ playing=!playing; e.preventDefault(); }
  else if (e.code==='ArrowRight') seek(playT+5);
  else if (e.code==='ArrowLeft') seek(playT-5);
  else if (e.code==='KeyR'){ resetSim(); playT=0; }
  hint.style.opacity=1; hintShown=performance.now();
});

resetSim();
const qs=new URLSearchParams(location.search);
if (qs.has('t')) seek(parseFloat(qs.get('t'))||0);
if (qs.has('pause')) playing=false;
window.__film={seek,render:()=>render(playT),get t(){return playT;}};
if (!qs.has('still')) requestAnimationFrame(t=>{last=t;frame(t);}); else render(playT);
</script>
</body>
